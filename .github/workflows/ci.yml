name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: tools/godot
          key: godot-4.5.1-stable

      - name: Headless tests
        run: ./packaging/build.sh --test
