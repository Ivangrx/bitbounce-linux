name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            tools/godot
            ~/.local/share/godot/export_templates
          key: godot-4.5.1-stable-templates

      - name: Test
        run: ./packaging/build.sh --test

      - name: Build
        env:
          BITBOUNCE_VERSION: ${{ github.ref_name }}
        run: ./packaging/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/bitbounce-linux-x86_64.tar.gz \
            build/bitbounce-linux-x86_64.tar.gz.sha256 \
            --title "Bitbounce $GITHUB_REF_NAME" \
            --generate-notes
